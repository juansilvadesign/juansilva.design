<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-responsive-01-hero"
        class="scene"
        data-composition-id="responsive-01-hero"
        data-composition-src="compositions/frames/responsive-01-hero.html"
        data-start="0"
        data-duration="6.3"
        data-track-index="0"
      ></div>

      <div
        id="el-responsive-02-cards"
        class="scene"
        data-composition-id="responsive-02-cards"
        data-composition-src="compositions/frames/responsive-02-cards.html"
        data-start="6"
        data-duration="6.3"
        data-track-index="1"
      ></div>

      <div
        id="el-responsive-03-plans"
        class="scene"
        data-composition-id="responsive-03-plans"
        data-composition-src="compositions/frames/responsive-03-plans.html"
        data-start="12"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-responsive-01-hero", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-responsive-02-cards", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 6);
        tl.to("#el-responsive-02-cards", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-responsive-03-plans", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 12);
        tl.to({}, { duration: 18 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
