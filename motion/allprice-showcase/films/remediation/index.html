<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-remediation-01-intent"
        class="scene"
        data-composition-id="remediation-01-intent"
        data-composition-src="compositions/frames/remediation-01-intent.html"
        data-start="0"
        data-duration="4.25"
        data-track-index="0"
      ></div>

      <div
        id="el-remediation-02-source"
        class="scene"
        data-composition-id="remediation-02-source"
        data-composition-src="compositions/frames/remediation-02-source.html"
        data-start="4"
        data-duration="4.25"
        data-track-index="1"
      ></div>

      <div
        id="el-remediation-03-structure"
        class="scene"
        data-composition-id="remediation-03-structure"
        data-composition-src="compositions/frames/remediation-03-structure.html"
        data-start="8"
        data-duration="4.25"
        data-track-index="0"
      ></div>

      <div
        id="el-remediation-04-return"
        class="scene"
        data-composition-id="remediation-04-return"
        data-composition-src="compositions/frames/remediation-04-return.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-remediation-01-intent", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-remediation-02-source", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 4);
        tl.to("#el-remediation-02-source", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-remediation-03-structure", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 8);
        tl.to("#el-remediation-03-structure", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, 12);
        tl.fromTo("#el-remediation-04-return", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, 12);
        tl.to({}, { duration: 16 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
