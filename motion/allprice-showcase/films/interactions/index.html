<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-interactions-01-menu"
        class="scene"
        data-composition-id="interactions-01-menu"
        data-composition-src="compositions/frames/interactions-01-menu.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-interactions-02-answer"
        class="scene"
        data-composition-id="interactions-02-answer"
        data-composition-src="compositions/frames/interactions-02-answer.html"
        data-start="6"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-interactions-03-return"
        class="scene"
        data-composition-id="interactions-03-return"
        data-composition-src="compositions/frames/interactions-03-return.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].to({}, {duration:16}, 0); // master clock; child timelines own visual motion
    </script>
  </body>
</html>
