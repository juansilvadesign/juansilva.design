  <script>
    (() => {
      const positioner = document.getElementById("main-01-clarity-positioner");
      const rotationRig = document.getElementById("main-01-clarity-rotation-rig");
      const scaleWrapper = document.getElementById("main-01-clarity-scale-wrapper");
      const viewport = document.getElementById("main-01-clarity-viewport");
      const scrollTrack = document.getElementById("main-01-clarity-scroll-track");
      const opening = { x: 0, y: 122, z: 0, rx: 0, ry: 6, scale: 1.2 };
      const reading = { x: 0, y: 122, z: 0, rx: 0, ry: 0, scale: 1.2 };
      const handoff = { x: 0, y: 0, z: 0, rx: 0, ry: 0, scale: 1 };
      const camera = { ...opening };

      // One camera state and writer; translation remains outside rotation.
      // The fixed main-tour hierarchy separates position, rotation, and scale.
      function applyCamera() {
        positioner.style.transform = `translate3d(${camera.x}px, ${camera.y}px, ${camera.z}px)`;
        rotationRig.style.transform = `rotateX(${camera.rx}deg) rotateY(${camera.ry}deg)`;
        scaleWrapper.style.transform = `scale(${camera.scale})`;
      }
      applyCamera();

      const tl = gsap.timeline({ paused: true });

      // 0.00–1.10: shallow opening angle settles into the approved hero crop.
      tl.fromTo(camera, opening, {
        ...reading,
        duration: 1.1,
        ease: "power2.inOut",
        onUpdate: applyCamera
      }, 0);

      // 1.10–4.20: intentional still reading window, with no page scroll.
      tl.fromTo(camera, reading, {
        ...reading,
        duration: 3.1,
        ease: "none",
        immediateRender: false,
        onUpdate: applyCamera
      }, 1.1);
      tl.fromTo(scrollTrack, { y: 0 }, {
        y: 0,
        duration: 5,
        ease: "power2.inOut"
      }, 0);

      // 4.20–4.65: synchronized pullback to the shared 1440 × 900 page rig.
      tl.fromTo(camera, reading, {
        ...handoff,
        duration: 0.45,
        ease: "power2.inOut",
        immediateRender: false,
        onUpdate: applyCamera
      }, 4.2);

      // 4.65–5.00: open the matte only after the page camera is neutral.
      tl.fromTo(camera, handoff, {
        ...handoff,
        duration: 0.35,
        ease: "none",
        immediateRender: false,
        onUpdate: applyCamera
      }, 4.65);
      tl.fromTo(viewport, {
        clipPath: "inset(0px 0px 380px 0px round 12px)"
      }, {
        clipPath: "inset(0px 0px 0px 0px round 12px)",
        duration: 5 - 1 / 60 - 4.65,
        ease: "power2.inOut",
        immediateRender: false
      }, 4.65);

      window.__timelines = window.__timelines || {};
      window.__timelines["main-01-clarity"] = tl;
    })();
