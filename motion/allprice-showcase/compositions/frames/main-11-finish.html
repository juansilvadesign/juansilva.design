      const track = "#main-11-finish-scroll-track";

      const rig = document.getElementById("main-11-finish-rotation-rig");
      const camera = { x: 0, y: 0, z: 0, rx: 0, ry: 0 };
      const applyCamera = () => {
        rig.style.transform = `translate3d(${camera.x}px, ${camera.y}px, ${camera.z}px) rotateX(${camera.rx}deg) rotateY(${camera.ry}deg)`;
      };
      applyCamera();

      tl.set("#main-11-finish-positioner", { x: 0, y: 0, opacity: 1 }, 0);
      tl.set(["#main-11-finish-caption", "#main-11-finish-credit"], { opacity: 1 }, 0);
      tl.set("#main-11-finish-exit-matte", { opacity: 0 }, 0);

      // Settle at document y=10379 while fitting the complete 900px footer view.
      tl.fromTo(track,
        { x: 0, y: 0 },
        { x: 0, y: -199, duration: 1, ease: "power2.inOut", immediateRender: false },
        0);
      tl.fromTo(track,
        { x: 0, y: -199 },
        { x: 0, y: -199, duration: 4, ease: "power2.inOut", immediateRender: false },

      tl.fromTo(scaler,

      tl.fromTo(scaler,
        { scale: 0.9733333333 },
        { scale: 0.9733333333, duration: 4, ease: "none", immediateRender: false },

      // One camera state and one transform writer keep the reading hold front-on.
      tl.fromTo(camera,
        { x: 0, y: 0, z: 0, rx: 0, ry: 0 },
        { x: 0, y: 0, z: 0, rx: 0, ry: 0, duration: 3, ease: "none", immediateRender: false, onUpdate: applyCamera },

        { x: 0, y: 0, z: -80, rx: 3, ry: 0, duration: 1.75, ease: "power2.inOut", immediateRender: false, onUpdate: applyCamera },
        3);

      // The final quarter-second covers the complete scene with the white ground.
      tl.fromTo("#main-11-finish-exit-matte",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.inOut", immediateRender: false },
        4.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["main-11-finish"] = tl;
