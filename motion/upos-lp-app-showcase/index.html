<!DOCTYPE html>
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* upOS's own typeface, served from assets/ rather than a CDN: renders must be
         deterministic and offline-safe. Inter v20 is variable, so one file covers 100-900. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("assets/fonts/inter-var.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #ffffff;
      }
      body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }

      /* Full-bleed ground. Never on the composition root: the producer's frame
         compositing can drop the root's own background and render black. */
      #ground { position: absolute; inset: 0; background: #FBFCFE; }

      .view { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      #lp-view { opacity: 1; }
      .view > img { display: block; position: absolute; }

      /* ---- The landing page -------------------------------------------------
         Two strips, not one. The page latches feature rows to active via an
         IntersectionObserver at threshold 0.3, transition 1s staggered 200ms.
         A single static capture freezes every row at opacity-50 / grey #9CA3AF,
         which is why the first cut looked dead. So: the inactive strip is the
         base, the active strip sits above it inside a clip whose height tracks
         the scroll. Content that has crossed the activation line shows active,
         content below it stays inactive. That is the real latch, reproduced. */
      /* Scale and translate live on SEPARATE elements. With both on one node the
         transform-origin sits in the scrolled coordinate space, so a 1.015 "push"
         about a 5026px-tall box becomes a ~30px upward drift instead of a centred
         zoom. #lp-scaler is frame-sized and scales about frame centre; #lp-track
         carries the scroll. */
      #lp-scaler, #lp-scaler2 {
        position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
        transform-origin: 960px 540px;
      }
      #lp-track { position: absolute; top: 0; left: 0; width: 1920px; height: 5026px; }
      #lp-strip, #lp-strip-active { width: 1920px; height: 5026px; top: 0; left: 0; }
      #lp-strip2 { width: 1920px; height: 1080px; top: 0; left: 0; }
      #lp-reveal {
        position: absolute; top: 0; left: 0;
        width: 1920px; height: 756px;   /* viewport 1080 x 0.7 = the threshold line */
        overflow: hidden;
      }
      #lp-reveal > img { position: absolute; top: 0; left: 0; }

      /* App screens fill the frame by width; tall ones are travelled, not shrunk. */
      #agenda-img   { width: 1920px; height: 1350px; left: 0; top: -135px; }
      #painel-img   { width: 1920px; height: 1080px; left: 0; top: 0; }
      #kanban-img   { width: 2880px; height: 2066px; left: 0; top: -300px; }
      #stat-img     { width: 2208px; height: 598px;  left: -144px; top: 241px; }
      #perfis-img   { width: 1920px; height: 1080px; left: 0; top: 0; }
      #matrix-img   { width: 1920px; height: 4085px; left: 0; top: 0; }
      #dash-img     { width: 1920px; height: 2184px; left: 0; top: 0; }

      /* A pan across a board wider than frame slices words at the edges. Dissolve
         them instead of cutting them: the crop reads as depth, not damage. */
      #kanban-view {
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 110px, #000 calc(100% - 110px), transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 110px, #000 calc(100% - 110px), transparent 100%);
      }

      /* A hover glow on one work order, so the board reads as a live surface rather
         than a picture being slid past. Geometry derived from the Figma frame tree. */
      #kanban-glow {
        position: absolute; left: 1201px; top: 424px; width: 729px; height: 347px;
        border-radius: 18px;
        box-shadow: 0 0 0 3px rgba(21,94,239,.55), 0 20px 52px -10px rgba(21,94,239,.60);
        background: rgba(21,94,239,.05);
        opacity: 0;
      }

      /* S4: a soft band travelling with the camera, reading as a scan down the areas. */
      #scan {
        position: absolute; left: 0; width: 1920px; height: 420px; top: 0;
        background: linear-gradient(180deg,
          rgba(21,94,239,0) 0%, rgba(21,94,239,.10) 45%, rgba(21,94,239,.06) 60%, rgba(21,94,239,0) 100%);
        mix-blend-mode: multiply;
        opacity: 0;
      }

      #counter {
        position: absolute; left: 0; right: 0; bottom: 64px;
        text-align: center;
        font-size: 34px; font-weight: 600; letter-spacing: -0.01em;
        color: #0B3FA8;
        opacity: 0;
      }
      #counter .muted { color: #5B6880; font-weight: 500; }

      #wipe {
        position: absolute; left: 0; width: 1920px; height: 1400px; bottom: -1400px;
        background: linear-gradient(0deg, #FBFCFE 0%, #FBFCFE 62%, rgba(251,252,254,0) 100%);
      }

      /* ---- Cursor -----------------------------------------------------------
         Drives the module navigation, so every screen change is motivated by an
         action rather than arriving as an unexplained cut. */
      #cursor {
        position: absolute; top: 0; left: 0; width: 30px; height: 36px;
        opacity: 0; z-index: 50;
        filter: drop-shadow(0 3px 6px rgba(14,20,32,.30));
      }
      #cursor svg { display: block; }
      /* The ripple is centred on the cursor's hotspot, not its bounding box. */
      #ripple {
        position: absolute; left: -26px; top: -26px;
        width: 56px; height: 56px; border-radius: 50%;
        border: 3px solid #155EEF; background: rgba(21,94,239,.16);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-oit2" id="stage" class="clip" data-start="0" data-duration="30" data-track-index="1">
        <div data-hf-id="hf-7hg0" id="ground"></div>

        <!-- S1 / S2 - the landing page Juan designed and coded -->
        <div data-hf-id="hf-eusp" id="lp-view" class="view">
          <div data-hf-id="hf-vuxe" id="lp-scaler" data-layout-allow-overflow="">
            <div data-hf-id="hf-3jzy" id="lp-track" data-layout-allow-overflow="">
            <img data-hf-id="hf-x1gt" data-layout-allow-overflow="" id="lp-strip" src="assets/lp-inactive@2x.png" alt="">
            <div data-hf-id="hf-3r9u" id="lp-reveal" data-layout-allow-overflow="">
              <img data-hf-id="hf-ybv3" data-layout-allow-overflow="" id="lp-strip-active" src="assets/lp-active@2x.png" alt="">
            </div>
            </div>
          </div>
        </div>

        <!-- S2 / S3 - the product, entered through the page's own Agenda -->
        <div data-hf-id="hf-7xdp" id="agenda-view" class="view">
          <img data-hf-id="hf-rusq" data-layout-allow-overflow="" id="agenda-img" src="assets/1-1.1-agenda@3x.png" alt="">
        </div>

        <!-- S3 - front desk to money -->
        <div data-hf-id="hf-fyi0" id="painel-view" class="view">
          <img data-hf-id="hf-f3l3" data-layout-allow-overflow="" id="painel-img" src="assets/1-0.1-painel@3x.png" alt="">
        </div>
        <div data-hf-id="hf-yw06" id="kanban-view" class="view">
          <img data-hf-id="hf-wd3f" data-layout-allow-overflow="" id="kanban-img" src="assets/2-3-kanban@1.5x.png" alt="">
          <div data-hf-id="hf-aws9" id="kanban-glow" data-layout-allow-overflow=""></div>
        </div>
        <div data-hf-id="hf-hguz" id="stat-view" class="view">
          <img data-hf-id="hf-c8wx" data-layout-allow-overflow="" id="stat-img" src="assets/6-2.1-statband@3x.png" alt="">
        </div>

        <!-- S4 - permissions are a module -->
        <div data-hf-id="hf-2hly" id="perfis-view" class="view">
          <img data-hf-id="hf-gtaq" data-layout-allow-overflow="" id="perfis-img" src="assets/7-3.1-perfis@3x.png" alt="">
        </div>
        <div data-hf-id="hf-5v68" id="matrix-view" class="view">
          <img data-hf-id="hf-8yoz" data-layout-allow-overflow="" id="matrix-img" src="assets/7-3.3-matrix@2x.png" alt="">
          <div data-hf-id="hf-4683" id="scan" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-pjc1" id="wipe" data-layout-allow-overflow=""></div>
        </div>
        <div data-hf-id="hf-6nij" id="counter"><span data-hf-id="hf-bzgh">~26 permissões</span> <span data-hf-id="hf-z1id" class="muted">· 8 áreas</span></div>

        <!-- S5 - back into the page. Distinct src: two <img> sharing one source
             trip duplicate_media_discovery_risk and can collapse to a blank render. -->
        <div data-hf-id="hf-io2p" id="dash-view" class="view">
          <img data-hf-id="hf-8bz0" data-layout-allow-overflow="" id="dash-img" src="assets/1-2-dashboard@2.5x.png" alt="">
        </div>
        <div data-hf-id="hf-iigx" id="lp-view2" class="view">
          <div data-hf-id="hf-x34c" id="lp-scaler2">
            <img data-hf-id="hf-5vxt" data-layout-allow-overflow="" id="lp-strip2" src="assets/lp-hero@2x.png" alt="">
          </div>
        </div>

        <div data-hf-id="hf-24s6" id="cursor" data-layout-allow-overflow="">
          <svg data-hf-id="hf-5dth" width="30" height="36" viewBox="0 0 30 36" aria-hidden="true">
            <path data-hf-id="hf-hjz7" d="M3 2.5 L3 27.5 L9.8 21.2 L14.1 31.2 L18.6 29.2 L14.4 19.4 L23.5 19.1 Z" fill="#ffffff" stroke="#0E1420" stroke-width="2.2" stroke-linejoin="round" />
          </svg>
          <div data-hf-id="hf-l3gf" id="ripple"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ---------------------------------------------------------------
         Geometry, measured off the live page at 2x DPR - not guessed.
         Landing page      1920 x 7871 css px
         Hero dashboard    x376 y420  1168 x 934   (natural 3504x2802, 3.0x)
         Agenda card       x397 y4082 1126 x 808   (natural 3512x2519, 3.1x)
         At scroll 3946 the agenda card centre sits at (960, 540) - frame
         centre exactly - so S2 is a clean centre-origin scale.
         --------------------------------------------------------------- */
      const AGENDA_SCROLL = 3946;
      const AGENDA_FILL = 1920 / 1126;
      const HERO_SCALE = 1168 / 1920;
      const HERO_DY = (420 + 934 / 2) - 540;
      const LINE = 756;                       // IntersectionObserver threshold 0.3

      // Move the page and the activation boundary as one: the reveal height is
      // always scroll + the threshold line, which is what the observer does.
      const scrollTo = (s, at, dur, ease) => {
        tl.to("#lp-track", { y: -s, duration: dur, ease: ease }, at)
          .to("#lp-reveal", { height: s + LINE, duration: dur, ease: ease }, at);
      };

      /* ===== S1 - the page (0.0-8.0s) ===== */
      tl.fromTo("#lp-scaler", { scale: 1 }, { scale: 1.015, duration: 1.6, ease: "power1.in" }, 0);
      scrollTo(1442, 1.6, 1.5, "power2.inOut");
      scrollTo(1442, 3.1, 0.7, "none");
      scrollTo(2892, 3.8, 1.5, "power2.inOut");
      scrollTo(2892, 5.3, 0.7, "none");
      scrollTo(AGENDA_SCROLL, 6.0, 2.0, "power2.inOut");

      /* ===== S2 - through the page, into the product (8.0-11.0s) ===== */
      tl.to("#lp-scaler", { scale: AGENDA_FILL, duration: 2.4, ease: "power2.in" }, 8.0)
        .to("#agenda-view", { autoAlpha: 1, duration: 0.2, ease: "none" }, 9.9)
        .to("#lp-view", { autoAlpha: 0, duration: 0.2, ease: "none" }, 9.9)
        .fromTo("#agenda-img", { scale: 1.06 }, { scale: 1, duration: 1.1, ease: "power1.out" }, 9.9);

      /* ===== Cursor =========================================================
         Each click lands just before the screen it motivates. */
      const move = (x, y, at, dur) =>
        tl.to("#cursor", { x: x, y: y, duration: dur, ease: "power2.inOut" }, at);
      const click = (at) =>
        tl.to("#cursor", { scale: 0.86, duration: 0.07, ease: "power2.in" }, at)
          .to("#cursor", { scale: 1, duration: 0.16, ease: "back.out(3)" }, at + 0.07)
          .fromTo("#ripple", { scale: 0.25, autoAlpha: 0.95 },
                  { scale: 1.9, autoAlpha: 0, duration: 0.52, ease: "power2.out" }, at);

      tl.set("#cursor", { x: 1180, y: 760 }, 0);
      tl.to("#cursor", { autoAlpha: 1, duration: 0.3 }, 11.2);

      move(1290, 554, 11.5, 1.05);  click(12.75);   // Servicos card -> kanban

      // The board pans, so a click would chase a moving target. Instead the cursor
      // arrives on one card and TRACKS it through the pan while the card glows —
      // a hover, which is what a real hand does on a kanban.
      move(1565, 597, 12.9, 0.4);
      tl.to("#cursor", { x: 605, duration: 2.3, ease: "power1.inOut" }, 13.3)
        .to("#kanban-glow", { autoAlpha: 1, duration: 0.35 }, 13.55)
        .to("#kanban-glow", { autoAlpha: 0, duration: 0.3 }, 15.25);

      move(1795, 694, 15.9, 0.9);   click(16.95);   // Cadastrar recebimento
      move(1684, 414, 18.2, 1.0);   click(19.55);   // + Novo perfil -> the matrix
      move(1808, 520, 21.2, 1.0);   click(22.3);    // a permission toggle
      tl.to("#cursor", { autoAlpha: 0, duration: 0.4 }, 24.2);

      /* ===== S3 - front desk to money (11.0-18.0s) ===== */
      tl.to("#agenda-view", { autoAlpha: 0, duration: 0.25 }, 11.0)
        .to("#painel-view", { autoAlpha: 1, duration: 0.25 }, 11.0)
        .fromTo("#painel-img", { scale: 1 }, { scale: 1.02, duration: 2.3, ease: "none" }, 11.0)

        .to("#painel-view", { autoAlpha: 0, duration: 0.25 }, 13.3)
        .to("#kanban-view", { autoAlpha: 1, duration: 0.25 }, 13.3)
        .fromTo("#kanban-img", { x: 0 }, { x: -960, duration: 2.3, ease: "power1.inOut" }, 13.3)
        .fromTo("#kanban-glow", { x: 0 }, { x: -960, duration: 2.3, ease: "power1.inOut" }, 13.3)

        .to("#kanban-view", { autoAlpha: 0, duration: 0.25 }, 15.6)
        .to("#stat-view", { autoAlpha: 1, duration: 0.25 }, 15.6)
        .fromTo("#stat-img", { y: 14, scale: 1 }, { y: 0, scale: 1.02, duration: 2.4, ease: "power1.out" }, 15.6);

      /* ===== S4 - permissions are a module (18.0-26.0s) ===== */
      tl.to("#stat-view", { autoAlpha: 0, duration: 0.3 }, 18.0)
        .to("#perfis-view", { autoAlpha: 1, duration: 0.3 }, 18.0)
        .fromTo("#perfis-img", { scale: 1.04 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 18.0)

        .to("#perfis-view", { autoAlpha: 0, duration: 0.4 }, 20.6)
        .to("#matrix-view", { autoAlpha: 1, duration: 0.4 }, 20.6)
        .fromTo("#matrix-img", { y: 200 }, { y: 0, duration: 1.0, ease: "power2.out" }, 20.6)

        .to("#matrix-img", { y: -2860, duration: 4.0, ease: "power1.inOut" }, 21.6)
        .fromTo("#scan", { y: -420, autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 21.6)
        .to("#scan", { y: 1080, duration: 3.6, ease: "power1.inOut" }, 21.8)
        .to("#scan", { autoAlpha: 0, duration: 0.4 }, 25.2);

      tl.fromTo("#counter", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 23.4)
        .to("#counter", { autoAlpha: 0, duration: 0.4 }, 25.6);

      /* ===== S5 - back into the page, the seam (26.0-30.0s) =================
         Frame 1800 must be compositionally identical to frame 0. The S5 strip is
         the ACTIVE capture; its hero region is byte-identical to the inactive
         one (verified sha256 e352cbaa...), so the seam holds. */
      tl.to("#wipe", { y: -1400, duration: 0.8, ease: "power2.inOut" }, 25.6)
        .to("#matrix-view", { autoAlpha: 0, duration: 0.2 }, 26.4)
        .to("#dash-view", { autoAlpha: 1, duration: 0.4 }, 26.0)
        .fromTo("#dash-img", { y: -120 }, { y: -260, duration: 1.0, ease: "power1.out" }, 26.0)

        .to("#lp-view2", { autoAlpha: 1, duration: 0.9, ease: "power1.inOut" }, 27.0)
        .fromTo("#lp-scaler2", { scale: 1.06 }, { scale: 1.015, duration: 1.8, ease: "power2.inOut" }, 27.0)
        .to("#dash-img", { scale: HERO_SCALE, y: HERO_DY - 260, duration: 2.0, ease: "power2.inOut" }, 27.0)
        .to("#dash-view", { autoAlpha: 0, duration: 0.5 }, 28.6)

        .to("#lp-scaler2", { scale: 1.0, duration: 1.2, ease: "power1.inOut" }, 28.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
